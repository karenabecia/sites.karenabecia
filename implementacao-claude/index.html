<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Implementação Claude | Abrindo página</title>
  <script src="config-virada.js"></script>
  <script>
    // A data de virada fica somente em config-virada.js.
    const virada = new Date(window.CLAUDE_VIRADA.em).getTime();
    const arquivo = Date.now() >= virada ? window.CLAUDE_VIRADA.espera : window.CLAUDE_VIRADA.vendas;
    const destino = new URL(arquivo + window.location.search + window.location.hash, window.location.href);
    window.location.replace(destino.href);
  </script>
</head>
<body>
  <p>Abrindo a página da Implementação Claude. <a href="pagina-vendas.html">Acessar a página de vendas</a>.</p>
</body>
</html>
