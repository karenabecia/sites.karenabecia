<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" preserveAspectRatio="none" shape-rendering="crispEdges" role="img" aria-label="Vale em pixel art com rio e estruturas nas laterais e centro livre para a trilha">
  <defs>
    <pattern id="grass" width="64" height="56" patternUnits="userSpaceOnUse"><rect width="64" height="56" fill="#B8E48B"/><path d="M6 11h5v5H6zm7 0h5v5h-5zm36 32h5v5h-5z" fill="#96D075"/><path d="M27 31h4v4h-4z" fill="#D8EEA5"/></pattern>
    <pattern id="field" width="25" height="21" patternUnits="userSpaceOnUse"><rect width="25" height="21" fill="#8FC76A"/><path d="M0 0h25v3H0zM4 7h4v11H4zm7 0h4v11h-4zm7 0h4v11h-4z" fill="#63A950"/></pattern>
    <symbol id="tree" viewBox="0 0 64 90"><path d="M27 63h12v25H27z" fill="#8A5A33"/><path d="M13 66H5V40h9V24h12V11h21v13h11v17h5v25H51v9H13z" fill="#063D2E"/><path d="M12 59V41h10V29h11V18h12v13h11v15h4v15H50v8H24V59z" fill="#16C76A"/><path d="M22 39h15v10H22zm24-9h8v9h-8z" fill="#71E787"/><path d="M28 40h6v16h-6zm-6 6h18v5H22z" fill="#EFFFE6"/></symbol>
    <symbol id="bush" viewBox="0 0 34 23"><path d="M3 12h5V6h8v4h6V4h7v7h4v11H3z" fill="#19794A"/><path d="M8 12h8v-5h5v7h7v5H8z" fill="#57BA65"/></symbol>
    <symbol id="crate" viewBox="0 0 27 25"><path d="M2 2h23v22H2z" fill="#5F4029"/><path d="M5 5h17v16H5z" fill="#8A5A33"/><path d="M5 8h17v3H5zm0 9h17v3H5z" fill="#BD8950"/></symbol>
    <symbol id="duck" viewBox="0 0 26 20"><path d="M2 9h18v8H7v-3H2zM12 4h10v9H12z" fill="#FFFBEA"/><path d="M21 8h5v4h-5z" fill="#EDA33E"/><path d="M18 7h2v2h-2z" fill="#16382A"/></symbol>
  </defs>
  <style>
    .current{animation:flow 1.2s steps(4) infinite}.current.late{animation-delay:-.6s}.fall{animation:flow 1s steps(4) infinite}.cube{animation:drift 5s linear infinite}.cube.two{animation-delay:-1s}.cube.three{animation-delay:-2s}.cube.four{animation-delay:-3s}.cube.five{animation-delay:-4s}.cube.six{animation-delay:-4.7s}.duck{animation:bob 2s ease-in-out infinite}.duck.other{animation-delay:-1s}.screen{transform-origin:150px 357px;animation:sway 1.8s ease-in-out infinite}
    @keyframes flow{to{transform:translateY(12px)}}@keyframes drift{0%{transform:translateY(0);fill:#8C7A4B}55%{fill:#8C7A4B}60%,100%{fill:#4A9FE0}100%{transform:translateY(375px)}}@keyframes bob{50%{transform:translateY(3px)}}@keyframes sway{50%{transform:rotate(3deg)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1000" height="690" fill="url(#grass)"/>
  <!-- Neutral seam: grass and identical stone bridges at both joins. -->
  <g fill="#A9B4A6"><path d="M466 0h68v22h-68zM466 668h68v22h-68z"/></g><g fill="#D9DFD1"><path d="M469 3h62v5h-62zm0 668h62v5h-62z"/></g><g fill="#7D8B80"><path d="M480 0h4v22h-4zm16 0h4v22h-4zm16 0h4v22h-4zM480 668h4v22h-4zm16 668h4v22h-4zm16 668h4v22h-4z"/></g>
  <!-- River never crosses the central play lane. -->
  <path d="M148 29 C141 95 174 128 169 198 S130 283 153 353 S169 472 142 548 S153 625 148 660" fill="none" stroke="#356C77" stroke-width="37" stroke-linecap="square"/>
  <path d="M148 29 C141 95 174 128 169 198" fill="none" stroke="#8C7A4B" stroke-width="27"/>
  <path d="M169 198 C168 254 130 282 153 353" fill="none" stroke="#6FA8C9" stroke-width="27"/>
  <path d="M153 353 C169 423 170 473 142 548 S153 625 148 660" fill="none" stroke="#4A9FE0" stroke-width="27"/>
  <g class="current" fill="#9BE0F5"><path d="M152 237h8v3h-8zm-10 50h8v3h-8zm13 92h9v3h-9zm-12 60h9v3h-9zm-5 148h9v3h-9z"/></g><g class="current late" fill="#CDEFFF"><path d="M158 253h5v3h-5zm-13 71h7v3h-7zm21 130h7v3h-7zm-20 156h8v3h-8z"/></g>
  <!-- Source and six raw-data cubes. -->
  <path d="M35 53h45V31h52v14h43v24h35v18H48V74H35z" fill="#6C7D73"/><path d="M46 57h40V39h37v13h43v20h27v11H54V70h-8z" fill="#A9B4A6"/><path d="M70 43h33v8H70zm48 21h36v7h-36z" fill="#D8DED4"/>
  <g class="cube"><rect x="137" y="101" width="7" height="7"/></g><g class="cube two"><rect x="151" y="112" width="7" height="7"/></g><g class="cube three"><rect x="142" y="126" width="7" height="7"/></g><g class="cube four"><rect x="155" y="141" width="7" height="7"/></g><g class="cube five"><rect x="145" y="158" width="7" height="7"/></g><g class="cube six"><rect x="157" y="169" width="7" height="7"/></g>
  <!-- Terraced crops stay in the outer corners. -->
  <path d="M746 27h254v88H746zM0 551h102v97H0z" fill="url(#field)"/><path d="M746 27h254v5H746zM0 551h102v5H0z" fill="#5F9C4B"/>
  <!-- Mill house without a visible wheel. -->
  <path d="M205 262h68v65h-68z" fill="#583B2A"/><path d="M212 269h54v51h-54z" fill="#B6804C"/><path d="M197 270l43-36 42 36v10h-85z" fill="#C75B3A"/><path d="M210 267l30-24 29 24z" fill="#E28A57"/><path d="M229 292h17v28h-17z" fill="#654129"/><path d="M252 286h11v13h-11z" fill="#F6DFAC"/>
  <!-- Filtering shed, two square screens, three green pipes and four crates. -->
  <path d="M25 337h104v73H25z" fill="#5C402A"/><path d="M32 344h90v59H32z" fill="#A77646"/><path d="M17 345l59-30 60 30v11H17z" fill="#C75B3A"/><path d="M33 343l43-20 43 20z" fill="#E39260"/>
  <g class="screen"><path d="M37 364h29v29H37zm44 0h29v29H81z" fill="#E1E8DA"/><path d="M42 369h19v4H42zm0 9h19v4H42zm0 9h19v4H42zm44-18h19v4H86zm0 9h19v4H86zm0 9h19v4H86z" fill="#7B9486"/></g>
  <path d="M116 379h7v40h-7zm10 0h7v40h-7zm10 0h7v40h-7z" fill="#0B7A45"/><path d="M113 412h34v5h-34z" fill="#4A9FE0"/>
  <use href="#crate" x="199" y="365" width="25" height="24"/><use href="#crate" x="222" y="365" width="25" height="24"/><use href="#crate" x="245" y="365" width="25" height="24"/><use href="#crate" x="268" y="365" width="25" height="24"/>
  <!-- Quiet star of linked, square islands in a small lake. -->
  <path d="M765 452h144v18h22v104h-13v22H764v-20h-17v-99h18z" fill="#2E779D"/><path d="M771 459h131v18h22v90h-13v20H771v-18h-17v-86h17z" fill="#4A9FE0"/><path class="current late" d="M777 473h49v4h-49zm98 26h36v4h-36zm-92 86h48v4h-48z" fill="#9BE0F5"/>
  <g fill="none" stroke="#8A5A33" stroke-width="9"><path d="M835 517 793 481m53 32 49-32m-59 45-45 42m57-43 45 44"/></g><g fill="none" stroke="#CDA06D" stroke-width="3"><path d="M835 517 793 481m53 32 49-32m-59 45-45 42m57-43 45 44"/></g>
  <path d="M818 502h39v39h-39z" fill="#23764B"/><path d="M824 507h28v28h-28z" fill="#82C873"/><path d="M831 512h14v16h-14z" fill="#0B7A45"/>
  <path d="M781 472h25v24h-25zM882 471h25v24h-25zM778 557h25v24h-25zM883 557h25v24h-25z" fill="#4C956A"/><path d="M786 478h13v12h-13z" fill="#9CC9AD"/><path d="M888 477h13v12h-13z" fill="#A9CDB8"/><path d="M784 563h13v12h-13z" fill="#9EC6B6"/><path d="M889 563h13v12h-13z" fill="#B8D6BE"/>
  <!-- Low stone dam with a small waterfall into the same river. -->
  <path d="M67 547h124v45H67z" fill="#64766C"/><path d="M74 553h111v33H74z" fill="#A9B4A6"/><path d="M82 558h22v10H82zm32 0h22v10h-22zm32 0h22v10h-22z" fill="#D7DED1"/><path d="M132 569h31v22h-31z" fill="#537368"/><g class="fall"><path d="M136 590h8v28h-8zm11 0h7v28h-7z" fill="#9BE0F5"/></g>
  <!-- Sparse decoration, all outside the central lane. -->
  <use href="#tree" x="25" y="183" width="64" height="90"/><use href="#tree" x="914" y="159" width="64" height="90"/><use href="#tree" x="889" y="327" width="55" height="78"/><use href="#bush" x="42" y="470" width="34" height="23"/><use href="#bush" x="710" y="385" width="34" height="23"/><use href="#bush" x="923" y="610" width="34" height="23"/>
  <g fill="#A9B4A6"><path d="M324 292h13v5h-13zm-8 219h17v5h-17zM682 281h16v5h-16zm10 352h13v5h-13z"/></g>
  <g fill="#E890AB"><rect x="60" y="512" width="5" height="5"/><rect x="75" y="505" width="5" height="5"/><rect x="942" y="288" width="5" height="5"/></g><g fill="#E5D16A"><rect x="690" y="120" width="5" height="5"/><rect x="705" y="127" width="5" height="5"/><rect x="243" y="493" width="5" height="5"/></g>
  <g class="duck"><use href="#duck" x="172" y="489" width="26" height="20"/></g><g class="duck other"><use href="#duck" x="179" y="613" width="26" height="20"/></g>
</svg>
