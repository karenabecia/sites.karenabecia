<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uau Língo · Presença na aula</title><link rel="icon" href="uaulingo-favicon.png"><style>
:root{font-family:Arial,sans-serif;color:#063d2e;background:#f7f8f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#e1f8e6,transparent 40%),radial-gradient(circle at 85% 85%,#f0e0ff,transparent 42%),#f7f8f1}[hidden]{display:none!important}.card{width:min(100%,520px);background:white;border:2px solid #cfe4d3;border-radius:20px;box-shadow:9px 9px 0 #d9c4f1;padding:28px}.logo{display:block;width:180px;max-width:100%;margin:0 auto 20px}.kicker{font:900 .7rem monospace;color:#7b34b0;letter-spacing:.15em}.card h1{font-size:clamp(1.7rem,4vw,2.35rem);margin:8px 0}.card p{color:#61786b;line-height:1.5}.field{display:block;font-size:.82rem;font-weight:900;margin-top:16px}.field input{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #bed8c6;border-radius:9px;font:inherit}.btn{display:block;width:100%;margin-top:19px;border:0;border-radius:10px;background:#16c76a;color:#063d2e;padding:14px;font-weight:900;font-size:.95rem;cursor:pointer;box-shadow:0 4px 0 #0b8b50;text-align:center;text-decoration:none}.btn:disabled{opacity:.5;cursor:default}.muted-link{display:block;text-align:center;margin-top:20px;color:#6c349a;font-weight:800}.notice{border-radius:10px;padding:12px;background:#f0e7fb;color:#593181;font-size:.85rem;font-weight:800}.success{background:#dff8e7;color:#087b45}.error{background:#fff0ee;color:#a2383b}.status{min-height:20px;margin-top:14px;font-weight:800;font-size:.84rem}.attendance-confirmed{text-align:center;color:#087b45;margin:0;padding:32px 0}
</style></head><body><main class="card"><img class="logo" src="uaulingo-logo.png" alt="Uau Língo"><span class="kicker">AULA AO VIVO</span><h1>Lista de presença</h1><p id="description">Entre com seu e-mail e senha do Uau Língo para marcar presença na aula.</p><div id="listStatus" class="notice" role="status">Verificando a lista…</div><form id="loginForm" hidden><label class="field">E-mail<input id="email" type="email" autocomplete="username" required></label><label class="field">Senha<input id="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">Receber XP</button></form><p class="status" id="message" role="status"></p><a class="muted-link" href="uaulingo.html">Voltar ao mapa</a></main><script src="uaulingo-supabase.js"></script><script src="uaulingo-presenca.js"></script></body></html>
