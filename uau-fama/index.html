  <style>
:root{--paper:#151009;--surface:#221810;--ink:#f4ece1;--orange:#ff7a2e;--muted:#a89178;--gap:12px;--line:rgba(244,236,225,.14)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.site-banner{display:block;width:100%;height:auto;max-height:46vh;object-fit:cover}
.site-header{position:fixed;z-index:10;top:0;left:0;right:0;display:flex;justify-content:center;align-items:center;padding:18px 28px;border-bottom:1px solid var(--line);background:rgba(21,16,9,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform:translateY(-100%);opacity:0;pointer-events:none;transition:transform .35s ease,opacity .35s ease}.site-header.is-visible{transform:translateY(0);opacity:1;pointer-events:auto}
.brand{color:var(--orange);text-decoration:none;font-family:"Anton",sans-serif;font-size:22px;font-weight:400;letter-spacing:.015em}

.gallery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--gap);align-items:start}.gallery-column{display:flex;min-width:0;flex-direction:column;gap:var(--gap)}
.gallery-message{column-span:all;margin:30px 0 90px;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:14px}
.card{position:relative;display:block;width:100%;height:auto;margin:0;padding:0;border:0;background:var(--surface);overflow:hidden;cursor:zoom-in;text-align:left;opacity:1;transition:opacity 1.8s ease-in-out,filter 1.8s ease-in-out,transform 1.8s ease-in-out}.card.ratio-3-2{aspect-ratio:3/2}.card.ratio-1-1{aspect-ratio:1}.card.ratio-4-3{aspect-ratio:4/3}.card.ratio-16-9{aspect-ratio:16/9}.card.ratio-2-3{aspect-ratio:2/3}.card.ratio-3-4{aspect-ratio:3/4}.card.ratio-2-1{aspect-ratio:2/1}.card img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.8,.2,1),filter .5s}.card:hover img,.card:focus-visible img{transform:scale(1.025);filter:brightness(.72)}.card.is-dashboard img{object-fit:contain;background:var(--surface)}.card.is-dashboard:hover img,.card.is-dashboard:focus-visible img{transform:none;filter:brightness(.85)}.card-info{position:absolute;inset:auto 0 0;display:flex;align-items:flex-end;padding:16px;opacity:0;transform:translateY(5px);transition:.3s;background:linear-gradient(transparent,rgba(0,0,0,.7))}.card:hover .card-info,.card:focus-visible .card-info{opacity:1;transform:none}.card-description{color:#fff;font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.play{position:absolute;top:14px;right:14px;width:38px;height:38px;border:1px solid rgba(255,255,255,.7);border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.25);backdrop-filter:blur(6px)}
.card.is-changing{opacity:0;filter:brightness(.15);transform:scale(.995)}.card.is-arriving{animation:card-arrive 1.4s ease both}.scroll-sentinel{height:1px}
@keyframes card-arrive{from{opacity:0;filter:brightness(.2)}to{opacity:1;filter:brightness(1)}}
.modal{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:24px;visibility:hidden;opacity:0;transition:.35s}.modal.open{visibility:visible;opacity:1}.modal-backdrop{position:absolute;inset:0;border:0;background:rgba(5,3,1,.85);backdrop-filter:blur(8px);cursor:zoom-out}.modal-panel{position:relative;width:min(1180px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--paper);border:1px solid var(--line);transform:translateY(18px);transition:.4s cubic-bezier(.2,.8,.2,1)}.modal.open .modal-panel{transform:none}.modal-close{position:absolute;z-index:2;top:12px;right:14px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(21,16,9,.9);color:var(--ink);font-size:27px;line-height:1;cursor:pointer}.modal-media{display:grid;place-items:center;background:#0b0704;min-height:300px}.modal-media img,.modal-media video{display:block;max-width:100%;max-height:70vh}.modal-media iframe{display:block;width:100%;aspect-ratio:16/9;border:0}.modal-copy{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:28px}.modal-kicker{margin:0 0 5px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em}.modal-copy h2{margin:0;font-family:"DM Sans",sans-serif;font-size:38px;font-weight:600}.modal-description{max-width:500px;margin:5px 0 0;color:var(--muted);font-size:14px;line-height:1.65}
footer{display:flex;justify-content:space-between;margin:0 28px;padding:22px 0 30px;border-top:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cta-float{position:fixed;z-index:15;left:50%;bottom:22px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:999px;background:var(--orange);color:#151009;text-decoration:none;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .25s ease,box-shadow .25s ease}.cta-float:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.6)}.cta-float span{font-size:17px;line-height:1}
@media(max-width:700px){.cta-float{bottom:14px;padding:12px 18px;font-size:12.5px;text-align:center;width:calc(100% - 32px)}main{padding-bottom:96px}}

@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}.gallery.is-shuffling{transform:none}}

  <script>

window.GALLERY_SETTINGS = {

  shuffleCount: 3,         // quantidade de cartões trocados em cada onda
  shuffleStagger: 4000,    // intervalo de 4 segundos entre os cartões da mesma onda
  infiniteScroll: true,     // acrescenta uma nova composição ao chegar ao fim
  sheetUrl: "https://script.google.com/macros/s/AKfycbxc7EMmvH-Uhp6WXIigCBCj6uK2_AzuiUcV2PlE7J_NSElsHTBu4MsmA5vPgRQ8F10i/exec" // aplicativo web do Google Sheets
};

window.GALLERY_ITEMS = [
  {

  <script>
(() => {
  let items = Array.isArray(window.GALLERY_ITEMS) ? window.GALLERY_ITEMS : [];
  const settings = window.GALLERY_SETTINGS || {};
  const gallery = document.querySelector("#gallery");
  const modal = document.querySelector("#modal");
  const modalMedia = document.querySelector("#modal-media");
  const sentinel = document.querySelector("#scroll-sentinel");
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ratios = ["3-2", "1-1", "16-9", "4-3", "2-3", "1-1", "2-1", "3-4"];
  let lastFocused = null;
  let cardNumber = 0;
  let adding = false;
  let layoutColumns = 0;

  const shuffle = source => {
    const copy = [...source];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  };

  function usedIds() {
    return new Set([...gallery.querySelectorAll(".card")].map(card => card.dataset.id));
  }

  function pickItem(excludeIds) {
    const pool = items.filter(item => !excludeIds.has(item.id));
    if (pool.length) return pool[Math.floor(Math.random() * pool.length)];
    return items[Math.floor(Math.random() * items.length)];
  }

  function isDashboardItem(item) {
    const tags = (item.tags || []).map(t => String(t).toLowerCase().trim());
    return tags.includes("dashboard") || String(item.categoria || "").toLowerCase().trim() === "dashboard";
  }

  const landscapeRatios = ["16-9", "3-2", "2-1"];

  function pickRatio(item, fallbackRatio) {
    if (isDashboardItem(item)) {
      return landscapeRatios.includes(fallbackRatio)
        ? fallbackRatio
        : landscapeRatios[Math.floor(Math.random() * landscapeRatios.length)];
    }
    return fallbackRatio;
  }

  function markup(item, ratio, arriving = false) {
    cardNumber++;
    const dashboard = isDashboardItem(item);
    return `<button class="card ratio-${ratio}${dashboard ? " is-dashboard" : ""}${arriving && !reducedMotion ? " is-arriving" : ""}" type="button" data-id="${item.id}" data-ratio="${ratio}" aria-label="Abrir ${item.titulo}">
      <img src="${item.thumbnail}" alt="${item.titulo}" loading="lazy" decoding="async">
      ${item.tipo === "video" ? '<span class="play" aria-hidden="true">▶</span>' : ""}
      ${item.descricao ? `<span class="card-info"><span class="card-description">${item.descricao}</span></span>` : ""}
    </button>`;
  }

  function desiredColumnCount() {
    if (innerWidth <= 700) return 2;
    if (innerWidth <= 1000) return 3;
    if (innerWidth <= 1200) return 4;
    return 5;
  }

  function shortestColumn() {
    return [...gallery.querySelectorAll(".gallery-column")]
      .sort((a, b) => a.scrollHeight - b.scrollHeight)[0];
  }

  function buildColumns(force = false) {
    const desired = desiredColumnCount();
    if (!force && layoutColumns === desired && gallery.querySelector(".gallery-column")) return;
    const cards = [...gallery.querySelectorAll(".card")];
    gallery.innerHTML = "";
    layoutColumns = desired;
    for (let i = 0; i < desired; i++) {
      const column = document.createElement("div");
      column.className = "gallery-column";
      gallery.appendChild(column);
    }
    cards.forEach(card => shortestColumn().appendChild(card));
  }

  async function appendBatch(arriving = true) {
    if (!items.length || adding) return;
    adding = true;
    buildColumns();
    const startIndex = cardNumber;
    const batchSize = Math.max(16, Math.min(24, items.length));
    for (let i = 0; i < batchSize; i++) {
      const item = pickItem(usedIds());
      const ratio = pickRatio(item, ratios[(startIndex + i) % ratios.length]);
      shortestColumn().insertAdjacentHTML("beforeend", markup(item, ratio, arriving));
      if (!reducedMotion) await new Promise(resolve => setTimeout(resolve, 110));
    }
    adding = false;
    fillPage();
  }

  function fillPage() {
    if (settings.infiniteScroll && !adding && sentinel.getBoundingClientRect().top < innerHeight + 1000) appendBatch();
  }

  function visibleCards() {
    return [...gallery.querySelectorAll(".card:not(.is-changing)")].filter(card => {
      const box = card.getBoundingClientRect();
      return box.bottom > 0 && box.top < innerHeight;
    });
  }

  function changeCard(card) {
    if (!card?.isConnected || card.classList.contains("is-changing")) return;
    const next = pickItem(usedIds());
    const ratio = pickRatio(next, card.dataset.ratio);
    card.classList.add("is-changing");
    setTimeout(() => {
      const holder = document.createElement("div");
      holder.innerHTML = markup(next, ratio);
      const replacement = holder.firstElementChild;
      card.replaceWith(replacement);
      if (!reducedMotion) {
        replacement.classList.add("is-changing");
        requestAnimationFrame(() => requestAnimationFrame(() => replacement.classList.remove("is-changing")));
      }
    }, reducedMotion ? 0 : 1800);
  }

  function changeWave() {
    if (!items.length || modal.classList.contains("open") || document.hidden) return;
    const available = shuffle(visibleCards());
    const count = Math.min(Math.max(Number(settings.shuffleCount) || 3, 1), available.length);
    const stagger = Math.max(Number(settings.shuffleStagger) || 1200, 300);
    available.slice(0, count).forEach((card, index) => {
      setTimeout(() => changeCard(card), index * stagger);
    });
  }

  function embedUrl(url = "") {
    const yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([^?&/]+)/);
    if (yt) {
      const origin = location.protocol === "http:" || location.protocol === "https:"
        ? `&origin=${encodeURIComponent(location.origin)}`
        : "";
      return `https://www.youtube.com/embed/${yt[1]}?autoplay=1&rel=0${origin}`;
    }
    const vimeo = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    return vimeo ? `https://player.vimeo.com/video/${vimeo[1]}?autoplay=1` : null;
  }

  function openModal(item) {
    if (!item) return;
    lastFocused = document.activeElement;
    const embed = item.tipo === "video" ? embedUrl(item.videoUrl) : null;
    if (embed) modalMedia.innerHTML = `<iframe src="${embed}" title="${item.titulo}" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
    else if (item.tipo === "video") modalMedia.innerHTML = `<video src="${item.videoUrl}" poster="${item.thumbnail}" controls autoplay playsinline></video>`;
    else modalMedia.innerHTML = `<img src="${item.src || item.thumbnail}" alt="${item.titulo}">`;
    document.querySelector("#modal-title").textContent = item.titulo;
    document.querySelector("#modal-description").textContent = item.descricao || "";
    document.querySelector("#modal-kicker").textContent = (item.tags || []).join(" · ");
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
    document.body.classList.add("modal-open");
    modal.querySelector(".modal-close").focus();
  }

  function closeModal() {
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
    document.body.classList.remove("modal-open");
    modalMedia.innerHTML = "";
    lastFocused?.focus();
  }

  async function loadSheet() {
    if (!settings.sheetUrl) return true;
    // Quando há uma planilha configurada, nenhum item local participa da galeria.
    items = [];
    try {
      const response = await fetch(settings.sheetUrl, { cache: "no-store" });
      if (!response.ok) throw new Error("Planilha indisponível");
      const data = await response.json();
      const rows = Array.isArray(data) ? data : data.items;
      if (!Array.isArray(rows)) throw new Error("Formato de dados inválido");
      items = rows
        .filter(row => row && (row.thumbnail || row.src) && row.titulo)
        .map((row, i) => ({
          ...row,
          id: String(row.id || `item-${i + 1}`),
          tipo: row.tipo || "image",
          thumbnail: row.thumbnail || row.src,
          tags: Array.isArray(row.tags) ? row.tags : String(row.tags || "").split(",").filter(Boolean)
        }));
      return true;
    } catch (error) {
      console.warn("Não foi possível carregar o Google Sheets.", error);
      return false;
    }
  }

  gallery.addEventListener("click", event => {
    const card = event.target.closest(".card");
    if (card) openModal(items.find(item => String(item.id) === card.dataset.id));
  });
  modal.addEventListener("click", event => { if (event.target.closest("[data-close]")) closeModal(); });
  document.addEventListener("keydown", event => { if (event.key === "Escape" && modal.classList.contains("open")) closeModal(); });
  let scrollQueued = false;
  addEventListener("scroll", () => {
    if (scrollQueued) return;
    scrollQueued = true;
    requestAnimationFrame(() => { scrollQueued = false; fillPage(); });
  }, { passive: true });
  let resizeTimer;
  addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => buildColumns(), 180);
  });

  const banner = document.querySelector(".site-banner");
  const header = document.querySelector(".site-header");
  if (banner && header && "IntersectionObserver" in window) {
    new IntersectionObserver(
      entries => header.classList.toggle("is-visible", !entries[0].isIntersecting),
      { threshold: 0 }
    ).observe(banner);
  }

  async function start() {
    const sheetLoaded = await loadSheet();
    document.querySelector("#year").textContent = new Date().getFullYear();
    if (settings.sheetUrl && !sheetLoaded) {
      gallery.innerHTML = '<p class="gallery-message">Não foi possível acessar a planilha neste momento.</p>';
      return;
    }
    if (!items.length) {
      gallery.innerHTML = '<p class="gallery-message">A planilha ainda não possui materiais válidos.</p>';
      return;
    }
    appendBatch(false);
    if (settings.autoShuffle) setInterval(changeWave, Math.max(settings.shuffleInterval || 7000, 4000));
    if (settings.infiniteScroll && "IntersectionObserver" in window) {
      new IntersectionObserver(entries => { if (entries[0].isIntersecting) appendBatch(); }, { rootMargin: "1400px 0px" }).observe(sentinel);
    }
  }
  start();
})();

  </script>
