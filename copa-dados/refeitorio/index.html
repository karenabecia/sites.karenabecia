<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão da Copa — Resultados e Ranking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-escuro:#06301B;
    --verde:#0B7A3D;
    --verde-claro:#22B461;
    --amarelo:#FFD400;
    --amarelo-escuro:#E8B800;
    --branco:#FBFBF6;
    --texto:#0A1F14;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Manrope', sans-serif;
    background:
      radial-gradient(circle at 10% 0%, rgba(255,212,0,0.18), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(34,180,97,0.25), transparent 45%),
      var(--verde-escuro);
    min-height:100vh;
    color:var(--branco);
    padding:24px 16px 60px;
  }
  .wrap{max-width:1000px; margin:0 auto;}

  header{text-align:center; margin-bottom:28px;}
  .selo{
    display:inline-block;
    background:var(--amarelo);
    color:var(--verde-escuro);
    font-family:'Anton', sans-serif;
    letter-spacing:0.08em;
    font-size:12px;
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:12px;
    text-transform:uppercase;
  }
  h1{
    font-family:'Anton', sans-serif;
    font-size:clamp(30px, 6vw, 46px);
    text-transform:uppercase;
    text-shadow:0 4px 0 rgba(0,0,0,0.25);
  }
  h1 span{color:var(--amarelo);}

  .destaque{
    background:linear-gradient(135deg, var(--verde-claro), var(--verde));
    border-radius:22px;
    padding:24px;
    margin-bottom:26px;
    box-shadow:0 16px 36px rgba(0,0,0,0.35);
    text-align:center;
    border:2px solid rgba(255,212,0,0.5);
  }
  .destaque-label{
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--amarelo);
    margin-bottom:10px;
  }
  .destaque-confronto{
    font-family:'Anton', sans-serif;
    font-size:clamp(24px,5vw,34px);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .destaque-prazo{
    font-size:14px;
    font-weight:700;
    color:#E8FFF1;
  }
  .destaque-vazio{
    font-family:'Anton', sans-serif;
    font-size:20px;
    color:var(--branco);
  }

  .colunas{
    display:grid;
    grid-template-columns:1.1fr 1fr;
    gap:20px;
  }
  @media (max-width: 760px){ .colunas{grid-template-columns:1fr;} }

  .painel{
    background:var(--branco);
    color:var(--texto);
    border-radius:18px;
    padding:20px;
    box-shadow:0 14px 30px rgba(0,0,0,0.3);
  }
  .painel h2{
    font-family:'Anton', sans-serif;
    font-size:18px;
    text-transform:uppercase;
    color:var(--verde);
    margin-bottom:16px;
    letter-spacing:0.02em;
  }

  /* RANKING */
  .rank-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 8px;
    border-bottom:1px solid #EEF2EC;
  }
  .rank-item:last-child{border-bottom:none;}
  .rank-pos{
    font-family:'Anton', sans-serif;
    font-size:18px;
    width:30px;
    text-align:center;
    color:var(--verde);
  }
  .rank-item:nth-child(1) .rank-pos{color:#D4A017;}
  .rank-item:nth-child(2) .rank-pos{color:#8C8C8C;}
  .rank-item:nth-child(3) .rank-pos{color:#A86B3F;}
  .rank-nome{flex:1; font-weight:800; font-size:14px;}
  .rank-meta{font-size:11px; color:#888; font-weight:600;}
  .rank-pontos{
    font-family:'Anton', sans-serif;
    font-size:18px;
    color:var(--verde);
  }

  /* JOGOS / CONTAGEM */
  .jogo-linha{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 8px;
    border-bottom:1px solid #EEF2EC;
    font-size:13px;
  }
  .jogo-linha:last-child{border-bottom:none;}
  .jogo-linha-confronto{font-weight:800;}
  .jogo-linha-placar{
    font-family:'Anton', sans-serif;
    font-size:16px;
    color:var(--verde);
    min-width:46px;
    text-align:center;
  }
  .jogo-linha-contagem{
    font-size:11px;
    font-weight:800;
    background:#EFF6F1;
    color:var(--verde);
    padding:3px 9px;
    border-radius:999px;
  }

  .vazio-mini{font-size:13px; color:#999; padding:8px 0;}

  footer{
    text-align:center;
    color:rgba(255,255,255,0.5);
    font-size:11px;
    margin-top:24px;
    font-weight:600;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="selo">Bolão do Refeitório</span>
    <h1>Resultados & <span>Ranking</span></h1>
  </header>

  <div class="destaque" id="proximo-jogo">
    <div class="destaque-label">Carregando próximo jogo...</div>
  </div>

  <div class="colunas">
    <div class="painel">
      <h2>🏆 Ranking</h2>
      <div id="ranking-lista"><p class="vazio-mini">Carregando...</p></div>
    </div>

    <div class="painel">
      <h2>⚽ Jogos & Palpites</h2>
      <div id="jogos-lista"><p class="vazio-mini">Carregando...</p></div>
    </div>
  </div>

  <footer>Atualiza automaticamente a cada 15 segundos</footer>
</div>

<script>
  // ⚠️ Troque pela URL da sua implantação do Apps Script
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyNBbF67Ok_ARaxPWcjDIn2DO-7H2ZdNuCjRQF8ty9np_JYWDziJmymcozGaHVTXo6kQA/exec';

  function formatarData(dataStr, horaStr){
    if (!dataStr) return '';
    const [ano, mes, dia] = dataStr.split('-');
    return `${dia}/${mes} às ${horaStr}`;
  }

  function renderProximoJogo(jogo){
    const el = document.getElementById('proximo-jogo');
    if (!jogo){
      el.innerHTML = '<div class="destaque-vazio">Nenhum jogo aberto para palpite no momento 🟡</div>';
      return;
    }
    el.innerHTML = `
      <div class="destaque-label">Próximo jogo — palpite ainda aberto</div>
      <div class="destaque-confronto">${jogo.time1} 🆚 ${jogo.time2}</div>
      <div class="destaque-prazo">Palpites até ${formatarData(jogo.data, jogo.hora)}</div>
    `;
  }

  function renderRanking(ranking){
    const el = document.getElementById('ranking-lista');
    if (ranking.length === 0){
      el.innerHTML = '<p class="vazio-mini">Ninguém palpitou ainda. Seja o primeiro!</p>';
      return;
    }
    el.innerHTML = ranking.map((r, i) => `
      <div class="rank-item">
        <span class="rank-pos">${i+1}º</span>
        <div style="flex:1">
          <div class="rank-nome">${r.nome}</div>
          <div class="rank-meta">${r.acertosExatos} placar${r.acertosExatos === 1 ? '' : 'es'} exato${r.acertosExatos === 1 ? '' : 's'} · ${r.totalPalpites} palpite${r.totalPalpites === 1 ? '' : 's'}</div>
        </div>
        <span class="rank-pontos">${r.pontos} pts</span>
      </div>
    `).join('');
  }

  function renderJogos(jogos, contagem){
    const el = document.getElementById('jogos-lista');
    if (jogos.length === 0){
      el.innerHTML = '<p class="vazio-mini">Nenhum jogo cadastrado ainda.</p>';
      return;
    }
    const ordenados = [...jogos].reverse();
    el.innerHTML = ordenados.map(j => {
      const temPlacar = j.placarTime1 !== '' && j.placarTime1 !== undefined && j.placarTime1 !== null;
      return `
      <div class="jogo-linha">
        <div>
          <div class="jogo-linha-confronto">${j.time1} x ${j.time2}</div>
          <div class="vazio-mini" style="padding:2px 0 0">${formatarData(j.data, j.hora)}</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="jogo-linha-placar">${temPlacar ? j.placarTime1 + '-' + j.placarTime2 : '—'}</span>
          <span class="jogo-linha-contagem">${contagem[j.id] || 0} palpites</span>
        </div>
      </div>`;
    }).join('');
  }

  // Leitura via JSONP: o Apps Script bloqueia fetch() normal por CORS,
  // mas uma tag <script> não sofre esse bloqueio.
  function jsonp(url){
    return new Promise((resolve, reject) => {
      const nomeCallback = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      const script = document.createElement('script');
      const timeout = setTimeout(() => {
        limpar();
        reject(new Error('timeout'));
      }, 10000);

      function limpar(){
        clearTimeout(timeout);
        delete window[nomeCallback];
        script.remove();
      }

      window[nomeCallback] = (data) => { limpar(); resolve(data); };
      script.onerror = () => { limpar(); reject(new Error('erro de rede')); };
      script.src = `${url}&callback=${nomeCallback}`;
      document.head.appendChild(script);
    });
  }

  function carregarDados(){
    jsonp(`${APPS_SCRIPT_URL}?action=dadosResultados`)
      .then(data => {
        if (!data.ok) return;
        renderProximoJogo(data.proximoJogo);
        renderRanking(data.ranking);
        renderJogos(data.jogos, data.contagemPalpites);
      })
      .catch(() => {
        document.getElementById('proximo-jogo').innerHTML = '<div class="destaque-vazio">Erro ao carregar dados</div>';
      });
  }

  carregarDados();
  setInterval(carregarDados, 15000);
</script>
</body>
</html>
